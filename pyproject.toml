[project]
name = "colon-af-sfmlearner"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "curl-cffi>=0.15.0",
    "datasets[vision]>=2.19.0",
    "huggingface_hub>=0.27.0",
    "opencv-python>=4.13.0.92",
    "playwright>=1.59.0",
    "pydantic>=2.12.5",
    "pyarrow>=12.0.0",
    "requests>=2.33.1",
    "scikit-image>=0.26.0",
    "setuptools<82",
    "six>=1.17.0",
    "tensorboard>=2.20.0",
    "tensorboardx>=2.6.4",
    "torch>=2.10.0",
    "torchvision>=0.25.0",
    "tqdm>=4.67.3",
    "transformers>=4.45.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]

[tool.pytest.ini_options]
# Scope collection to the maintained suite under tests/. The top-level
# test_simple.py imports matplotlib/torchvision and is not part of the
# maintained suite; excluding it keeps `uv run pytest` collectable.
testpaths = ["tests"]
